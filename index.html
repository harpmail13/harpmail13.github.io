<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harper's Portfolio</title>
  
  <!-- Explicit Google Fonts connection for Bitcount Prop Single -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single&display=swap" rel="stylesheet">

  <style>
    /* Hypnotic Smooth Shadow & Scale Pulse (Bypasses chunky font-weight steps) */
    @keyframes hypnoticPulse {
      0% {
        transform: scale(0.97);
        text-shadow: 0 0 2px rgba(101, 122, 31, 0.2);
      }
      50% {
        transform: scale(1.03);
        text-shadow: 0 0 16px rgba(101, 122, 31, 0.7), 0 0 30px rgba(101, 122, 31, 0.4);
      }
      100% {
        transform: scale(0.97);
        text-shadow: 0 0 2px rgba(101, 122, 31, 0.2);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #bebc9a !important; /* Cream background (#bebc9a) */
      color: #657a1f !important;            /* Olive text (#657a1f) */
      font-family: "Bitcount Prop Single", monospace, sans-serif;
      font-optical-sizing: auto;
      padding: 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* Minimalist Nav with a Filleted (Rounded) Olive Box */
    nav {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-id {
      font-weight: 900;
      font-size: 0.95rem;
      color: #657a1f;
      letter-spacing: 0.5px;
    }

    .nav-box {
      background-color: #657a1f; /* Olive box background */
      padding: 10px 20px;
      border-radius: 12px;     /* Filleted (rounded) corners */
    }

    .nav-links {
      display: flex;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      color: #bebc9a !important; /* Cream text inside the olive box */
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      transition: font-weight 0.2s ease, opacity 0.2s ease;
    }

    .nav-links a:hover {
      opacity: 0.7; /* Subdued hover effect inside the box */
      font-weight: 900;          
    }

    /* Variable Center Stage Area */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center; /* Centered horizontally */
      padding: 60px 0;
    }

    .hero-text {
      font-size: clamp(4rem, 16vw, 13rem); /* Fluid responsive screen tracking */
      color: #657a1f;
      text-align: center; /* Keeps the fluid typography text box strictly centered */
      line-height: 0.8;
      text-transform: uppercase;
      font-weight: 400; /* Fixed clean baseline weight */
      
      /* Hypnotic buttery smooth settings */
      animation: hypnoticPulse 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      will-change: transform, text-shadow;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    footer {
      font-size: 0.85rem;
      color: #bebc9a;
      font-weight: 100;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Utility with Filleted Olive Box -->
  <nav>
    <div class="brand-id"></div>
    <div class="nav-box">
      <ul class="nav-links">
        <li><a href="/bio/">Bio</a></li>
        <li><a href="/1517/">1517 Medici</a></li>
        <li><a href="https://harpmail13.github.io/projects/">Projects</a></li>
        <li><a href="mailto:harpmail13@gmail.com">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- Variable Axis Hero Landing -->
  <main>
    <div class="hero-text">Welcome</div>
  </main>

  <footer></footer>

</body>
</html>
